name: Deploy QuirkLite to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Install dependencies
        run: npm install

      - name: Fix canvas CSS display size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/draw/Painter.js')
          s = p.read_text()
          needle = '        canvas.height = Math.max(1, Math.round(this.logicalHeight * Painter.RENDER_SCALE));\n'
          replacement = needle + '        canvas.style.width = this.logicalWidth + "px";\n        canvas.style.height = this.logicalHeight + "px";\n'
          if needle not in s:
              raise SystemExit('Expected Painter canvas scaling block not found')
          if 'canvas.style.width = this.logicalWidth + "px";' not in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Fix Safari Rect name collision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/gates/AmplitudeDisplay.js')
          s = p.read_text()
          old = '''    let drawRect = new Rect(\n        args.rect.center().x - drawWidth / 2,\n        args.rect.center().y - drawHeight / 2,\n        drawWidth,\n        drawHeight);'''
          new = '''    let drawRect = args.rect.\n        withW(drawWidth).\n        withH(drawHeight).\n        shiftedBy((args.rect.w - drawWidth) / 2, (args.rect.h - drawHeight) / 2);'''
          if old not in s:
              raise SystemExit('Expected Amps draw rectangle block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build QuirkLite
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site
          cp out/quirk.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
