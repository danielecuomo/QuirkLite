name: Deploy QuirkLite to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Install dependencies
        run: npm install

      - name: Fix canvas coordinate system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/draw/Painter.js')
          s = p.read_text()
          s = s.replace('''    /**\n     * Backing-store scale used to render Canvas content at higher resolution\n     * without changing Quirk\'s logical coordinate system.\n     */\n    static get RENDER_SCALE() { return 2; }\n''', '')
          s = s.replace('''        // Canvas width/height are the backing-store dimensions. Keep the\n        // logical dimensions separately so all existing painting code keeps\n        // using the original coordinate system.\n        this.logicalWidth = canvas.logicalWidth === undefined ? canvas.width : canvas.logicalWidth;\n        this.logicalHeight = canvas.logicalHeight === undefined ? canvas.height : canvas.logicalHeight;\n        canvas.width = Math.max(1, Math.round(this.logicalWidth * Painter.RENDER_SCALE));\n        canvas.height = Math.max(1, Math.round(this.logicalHeight * Painter.RENDER_SCALE));\n''', '')
          s = s.replace('        this.ctx.scale(Painter.RENDER_SCALE, Painter.RENDER_SCALE);\n', '')
          s = s.replace('return new Rect(0, 0, this.logicalWidth, this.logicalHeight);', 'return new Rect(0, 0, this.canvas.width, this.canvas.height);')
          s = s.replace('this.ctx.fillRect(0, 0, this.logicalWidth, this.logicalHeight);', 'this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);')
          p.write_text(s)
          PY

      - name: Build QuirkLite
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site
          cp out/quirk.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
