name: Deploy QuirkLite to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Install dependencies
        run: npm install

      - name: Fix canvas CSS display size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/draw/Painter.js')
          s = p.read_text()
          needle = '''        canvas.width = Math.max(1, Math.round(this.logicalWidth * Painter.RENDER_SCALE));
        canvas.height = Math.max(1, Math.round(this.logicalHeight * Painter.RENDER_SCALE));
'''
          replacement = '''        canvas.width = Math.max(1, Math.round(this.logicalWidth * Painter.RENDER_SCALE));
        canvas.height = Math.max(1, Math.round(this.logicalHeight * Painter.RENDER_SCALE));
        canvas.style.width = this.logicalWidth + "px";
        canvas.style.height = this.logicalHeight + "px";
'''
          if needle not in s:
              raise SystemExit('Expected Painter canvas scaling block not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Build QuirkLite
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site
          cp out/quirk.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
