name: Deploy QuirkLite to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Install dependencies
        run: npm install

      - name: Fix canvas CSS display size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/draw/Painter.js')
          s = p.read_text()
          needle = '        canvas.height = Math.max(1, Math.round(this.logicalHeight * Painter.RENDER_SCALE));\n'
          replacement = needle + '        canvas.style.width = this.logicalWidth + "px";\n        canvas.style.height = this.logicalHeight + "px";\n'
          if needle not in s:
              raise SystemExit('Expected Painter canvas scaling block not found')
          if 'canvas.style.width = this.logicalWidth + "px";' not in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Add 4x Cmd-plus zoom
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.js')
          s = p.read_text()
          marker = 'const canvasDiv = document.getElementById("canvasDiv");'
          insert = '''let quirkLiteZoom = 1;
const setQuirkLiteZoom = zoom => {
    quirkLiteZoom = zoom;
    window.quirkLiteZoom = zoom;
    document.documentElement.style.transformOrigin = "0 0";
    document.documentElement.style.transform = zoom === 1 ? "none" : "scale(" + zoom + ")";
};
setQuirkLiteZoom(1);
document.addEventListener("keydown", ev => {
    if (!ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "+" || ev.key === "=") {
        ev.preventDefault();
        setQuirkLiteZoom(4);
    } else if (ev.key === "0" || ev.key === "-") {
        ev.preventDefault();
        setQuirkLiteZoom(1);
    }
}, false);

'''
          if 'const setQuirkLiteZoom = zoom =>' not in s:
              if marker not in s:
                  raise SystemExit('Expected main.js canvas marker not found')
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          p = Path('src/browser/MouseWatcher.js')
          s = p.read_text()
          old = '    return new Point(ev.clientX + offsetX - b.left, ev.clientY + offsetY - b.top);'
          new = '''    let zoom = window.quirkLiteZoom === undefined ? 1 : window.quirkLiteZoom;
    return new Point(
        (ev.clientX + offsetX - b.left) / zoom,
        (ev.clientY + offsetY - b.top) / zoom);'''
          if old not in s:
              raise SystemExit('Expected MouseWatcher coordinate calculation not found')
          if 'window.quirkLiteZoom' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build QuirkLite
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site
          cp out/quirk.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
